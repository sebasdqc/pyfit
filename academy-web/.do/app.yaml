# Zyfit Academy — web e-learning desplegada como Static Site en DigitalOcean App
# Platform. Es una app SEPARADA del backend (sea-lion-app) y del panel Performance,
# con su propia URL *.ondigitalocean.app. Mismo pipeline: deploy on push a main.
#
# Primer deploy:
#   doctl apps create --spec academy-web/.do/app.yaml
# Actualizaciones (o se hace solo con deploy_on_push):
#   doctl apps update <APP_ID> --spec academy-web/.do/app.yaml
#
# Tras el primer deploy DO asigna la URL (zyfit-academy-xxxxx.ondigitalocean.app).
# Hay que añadirla al CORS del backend (CORS_ALLOWED_ORIGINS de sea-lion-app),
# igual que se hizo con el panel Performance.

name: zyfit-academy
region: nyc

static_sites:
  - name: web
    # Ruta relativa a la raíz del repo (no a la ubicación de este archivo).
    source_dir: /academy-web
    github:
      repo: sebasdqc/pyfit
      branch: main
      deploy_on_push: true
    # npm ci usa package-lock.json (debe estar commiteado). Vite emite a dist/.
    build_command: npm ci && npm run build
    output_dir: dist
    # SPA con React Router: cualquier ruta desconocida sirve index.html para que
    # el ruteo del cliente funcione al recargar.
    catchall_document: index.html
    envs:
      # Vite inyecta las VITE_* en BUILD time → quedan inlineadas en el bundle.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "https://sea-lion-app-a2j4f.ondigitalocean.app"
      # Identifica este site como el tenant CONMEBOL. El backend resuelve el
      # catálogo correcto (cursos CONMEBOL, branding navy) via X-Tenant-Slug.
      - key: VITE_TENANT_SLUG
        scope: BUILD_TIME
        value: "conmebol"
