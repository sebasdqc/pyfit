# Zyfit Academy (Ciencias del Deporte) — Static Site independiente en DO.
# Mismo código fuente que el site CONMEBOL (academy-web/) pero con tenant
# distinto: branding rojo, catálogo de ciencias del deporte aislado.
#
# Primer deploy:
#   doctl apps create --spec academy-web/.do/app-zyfit.yaml
#
# DO asignará una URL propia (zyfit-academy-deporte-xxxxx.ondigitalocean.app).
# Tras el primer deploy:
#   1. Añadir esa URL a CORS_ALLOWED_ORIGINS del backend (sea-lion-app) en DO.
#   2. Correr en la consola de sea-lion-app:
#        python manage.py seed_zyfit_tenants --only zyfit-academy
#
# Actualizaciones: deploy_on_push a main lo hace automáticamente.

name: zyfit-academy-deporte
region: nyc

static_sites:
  - name: web
    source_dir: /academy-web
    github:
      repo: sebasdqc/pyfit
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: "https://sea-lion-app-a2j4f.ondigitalocean.app"
      # Identifica este site como Zyfit Academy (Ciencias del Deporte).
      # El backend devuelve branding rojo + catálogo del tenant zyfit-academy.
      - key: VITE_TENANT_SLUG
        scope: BUILD_TIME
        value: "zyfit-academy"
