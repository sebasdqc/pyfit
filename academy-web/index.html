    <!-- CSS vars del tenant por defecto aplicadas ANTES de que cargue el JS
         para evitar el flash de colores al cargar/recargar la página.
         TenantContext las sobreescribe si el tenant tiene branding propio. -->
    <style>
      :root {
        --color-brand:        204 31 54;
        --color-brand-dark:   166 23 41;
        --color-brand-deep:   122 15 29;
        --color-accent:       230 57 80;
        --color-accent-light: 240 98 114;
        --color-accent-dark:  184 24 46;
        --color-ok:   22 163 74;
        --color-warn: 217 119 6;
        --color-danger: 220 38 38;
        --font-sans: 'Inter', system-ui, sans-serif;
      }
    </style>
    <!-- Inter (Zyfit Academy) + Ubuntu (CONMEBOL Evolución). El TenantContext
         activa la fuente correcta vía --font-sans según el tenant cargado.
         Archivo (variable, ejes wdth+wght) es la voz tipográfica EXCLUSIVA de la
         landing pública — el ancho hace la jerarquía en el sistema "Retrato de
         Planos"; el resto del producto sigue en Inter. Ver academy-web/DESIGN.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..120,400..800&family=Inter:wght@400;500;600;700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
