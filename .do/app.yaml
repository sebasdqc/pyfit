name: pyfit-backend
region: nyc

# ─── App-Level Environment Variables ──────────────────────────────────────
# Definidas UNA SOLA VEZ acá, disponibles automáticamente en todos los
# componentes (services, workers, jobs) sin repetirlas. Un componente puede
# pisar cualquiera de estas con su propia entrada en su `envs:` si necesitara
# un valor distinto (no es el caso acá).
envs:
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "False"
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
  - key: GROQ_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: ".ondigitalocean.app,localhost"
  # Obligatoria: cifra datos médicos (Profile.lesiones/condiciones_medicas/
  # notas_medicas/motivo_limitacion, DailyCheckin.dolor_hoy,
  # UserInjury.descripcion, Session.prompt_usado). Sin ella Django NO
  # arranca (falla con ImproperlyConfigured) — ni el servicio api, ni el
  # worker de Celery, ni el job de migrate. Generar con:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  - key: FIELD_ENCRYPTION_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  # Broker de Celery — necesaria para que POST /api/sessions/generate/
  # funcione (encola ai_workout.tasks.generate_session_task; sin Redis
  # alcanzable, el POST falla con 500 al intentar conectarse al broker).
  - key: REDIS_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}

services:
  - name: api
    source_dir: /backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      # Específicas de este componente (nada de lo de arriba se repite acá).
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app,https://panel.pyfit.app,http://localhost:3000,http://localhost:8081,http://localhost:5180"
      # Permite la URL autogenerada del Static Site del panel en DO
      # (zyfit-performance-xxxxx.ondigitalocean.app) sin fijar el subdominio.
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        scope: RUN_AND_BUILD_TIME
        value: '^https://zyfit-performance-.*\.ondigitalocean\.app$'
      - key: EMAIL_HOST
        scope: RUN_AND_BUILD_TIME
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        scope: RUN_AND_BUILD_TIME
        value: "587"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app"
      # Opcionales — activan DO Spaces para avatares y fotos de sesión (ver
      # pyfit/media_storage.py). Sin configurar, todo sigue como hasta ahora
      # (imágenes en base64 en la propia fila).
      # - key: SPACES_KEY
      #   scope: RUN_AND_BUILD_TIME
      #   type: SECRET
      # - key: SPACES_SECRET
      #   scope: RUN_AND_BUILD_TIME
      #   type: SECRET
      # - key: SPACES_BUCKET
      #   scope: RUN_AND_BUILD_TIME
      #   value: "pyfit-media"
      # - key: SPACES_REGION
      #   scope: RUN_AND_BUILD_TIME
      #   value: "nyc3"

# Worker de Celery (tasks async + beat embebido con -B: sync Garmin diario,
# purga de refresh tokens, retención de trazas GPS, generación de sesiones
# con IA). Un solo proceso combinado — el volumen actual no justifica separar
# worker y beat en dos componentes. No necesita envs propias: todo lo que usa
# (SECRET_KEY, DATABASE_URL, GROQ_API_KEY, FIELD_ENCRYPTION_KEY, REDIS_URL)
# ya le llega de las App-Level Environment Variables de arriba.
workers:
  - name: celery-worker
    source_dir: /backend
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: celery -A pyfit worker -B --loglevel=info --concurrency=2

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: /backend
    dockerfile_path: Dockerfile
    run_command: python manage.py migrate --noinput
    instance_count: 1
    instance_size_slug: basic-xxs
    # Tampoco necesita envs propias — SECRET_KEY/DATABASE_URL/DEBUG/
    # ALLOWED_HOSTS/FIELD_ENCRYPTION_KEY ya le llegan de las App-Level
    # Environment Variables de arriba (antes estaban repetidas acá a mano).

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
  # Broker de Celery (generación async de sesiones + tasks periódicos).
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
