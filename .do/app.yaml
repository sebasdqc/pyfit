name: sea-lion-app
region: sfo

# NOTA: este archivo es una copia de referencia PARCIAL del spec real (no
# incluye envs/alerts/ingress a proposito, para no commitear valores cifrados
# de secrets atados a esta instancia puntual de la app). El spec que
# realmente gobierna el deploy vive en DO; para verlo/editarlo de verdad:
# doctl apps spec get <APP_ID>.

# Celery (generacion async de rutinas + tasks periodicos: purga de tokens,
# retencion de trazas GPS, sync de Garmin) corre DENTRO del mismo contenedor
# de pyfit-backend (worker + beat en background, Redis local sin persistencia
# - ver backend/entrypoint.sh), NO como un componente ni un Redis gestionado
# aparte. Se eligio asi para no sumar costo mensual (DO no ofrece un tier
# gratis para Redis gestionado, solo "production").
#
# Contras aceptadas por ahora: si el contenedor reinicia (deploy, mantenimiento
# de DO) se pierde la cola de Celery en memoria (aceptable - son tasks
# fire-and-forget sin reintentos), y el worker comparte RAM con gunicorn en la
# misma instancia basic-xxs (si aparecen OOM kills, bajar --concurrency en el
# entrypoint o subir el instance_size_slug).
#
# Camino de upgrade cuando haya presupuesto: crear una base de datos REDIS
# "production" en DO, agregar REDIS_URL = ${redis.DATABASE_URL} a los envs de
# nivel App, y mover el worker de Celery a su propio componente `workers:` (ya
# no hace falta correrlo embebido en entrypoint.sh).

databases:
  - engine: PG
    name: dev-db-389502
    version: "17"

services:
  - name: pyfit-backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    github:
      repo: sebasdqc/pyfit
      branch: main
      deploy_on_push: true
