name: pyfit-backend
region: nyc

# App-Level Environment Variables.
# Defined ONCE here, available automatically to every component below
# (services, workers, jobs) without repeating them. A component can still
# override any of these with its own entry in its "envs:" list if it needs
# a different value (not the case here).
envs:
  - key: SECRET_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DEBUG
    scope: RUN_AND_BUILD_TIME
    value: "False"
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}
  - key: GROQ_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: ALLOWED_HOSTS
    scope: RUN_AND_BUILD_TIME
    value: ".ondigitalocean.app,localhost"
  # Required: encrypts medical data (Profile.lesiones/condiciones_medicas/
  # notas_medicas/motivo_limitacion, DailyCheckin.dolor_hoy,
  # UserInjury.descripcion, Session.prompt_usado). Without it Django will
  # NOT start (raises ImproperlyConfigured) - not the api service, not the
  # Celery worker, not the migrate job. Generate with:
  #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  - key: FIELD_ENCRYPTION_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  # Celery broker - required for POST /api/sessions/generate/ to work (it
  # enqueues ai_workout.tasks.generate_session_task; without a reachable
  # Redis, the POST fails with 500 trying to connect to the broker).
  - key: REDIS_URL
    scope: RUN_AND_BUILD_TIME
    value: ${redis.DATABASE_URL}

services:
  - name: api
    source_dir: /backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      # Specific to this component (nothing above is repeated here).
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app,https://panel.pyfit.app,http://localhost:3000,http://localhost:8081,http://localhost:5180"
      # Allows the auto-generated URL of the Performance panel Static Site
      # (zyfit-performance-xxxxx.ondigitalocean.app) without pinning the subdomain.
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        scope: RUN_AND_BUILD_TIME
        value: '^https://zyfit-performance-.*\.ondigitalocean\.app$'
      - key: EMAIL_HOST
        scope: RUN_AND_BUILD_TIME
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        scope: RUN_AND_BUILD_TIME
        value: "587"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app"
      # Optional - enables DO Spaces for avatars and session photos (see
      # pyfit/media_storage.py). Without them, everything keeps working as
      # today (images stored as base64 in the row).
      # - key: SPACES_KEY
      #   scope: RUN_AND_BUILD_TIME
      #   type: SECRET
      # - key: SPACES_SECRET
      #   scope: RUN_AND_BUILD_TIME
      #   type: SECRET
      # - key: SPACES_BUCKET
      #   scope: RUN_AND_BUILD_TIME
      #   value: "pyfit-media"
      # - key: SPACES_REGION
      #   scope: RUN_AND_BUILD_TIME
      #   value: "nyc3"

# Celery worker (async tasks + embedded beat via -B: daily Garmin sync,
# expired refresh token cleanup, GPS trace retention, AI session generation).
# One combined process - current volume does not justify a separate beat
# component. No envs of its own needed: everything it uses (SECRET_KEY,
# DATABASE_URL, GROQ_API_KEY, FIELD_ENCRYPTION_KEY, REDIS_URL) already comes
# from the App-Level Environment Variables above.
workers:
  - name: celery-worker
    source_dir: /backend
    dockerfile_path: Dockerfile
    instance_count: 1
    instance_size_slug: basic-xxs
    run_command: celery -A pyfit worker -B --loglevel=info --concurrency=2

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: /backend
    dockerfile_path: Dockerfile
    run_command: python manage.py migrate --noinput
    instance_count: 1
    instance_size_slug: basic-xxs
    # Also needs no envs of its own - SECRET_KEY/DATABASE_URL/DEBUG/
    # ALLOWED_HOSTS/FIELD_ENCRYPTION_KEY already come from the App-Level
    # Environment Variables above (previously repeated here by hand).

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
  # Celery broker (async session generation + periodic tasks).
  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
