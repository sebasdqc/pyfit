name: pyfit-backend
region: nyc

services:
  - name: api
    source_dir: /backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health/
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DEBUG
        scope: RUN_AND_BUILD_TIME
        value: "False"
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: GROQ_API_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: ALLOWED_HOSTS
        scope: RUN_AND_BUILD_TIME
        value: ".ondigitalocean.app,localhost"
      - key: CORS_ALLOWED_ORIGINS
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app,http://localhost:3000,http://localhost:8081"
      - key: EMAIL_HOST
        scope: RUN_AND_BUILD_TIME
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        scope: RUN_AND_BUILD_TIME
        value: "587"
      - key: EMAIL_HOST_USER
        scope: RUN_TIME
        type: SECRET
      - key: EMAIL_HOST_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_URL
        scope: RUN_AND_BUILD_TIME
        value: "https://pyfit.app"

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    source_dir: /backend
    dockerfile_path: Dockerfile
    run_command: python manage.py migrate --noinput
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: SECRET_KEY
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        value: ${db.DATABASE_URL}
      - key: DEBUG
        scope: RUN_AND_BUILD_TIME
        value: "False"
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: ".ondigitalocean.app,localhost"

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1
