name: Academy streak sweep

on:
  schedule:
    - cron: '0 8 * * *'   # todos los días a las 08:00 UTC
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily streak maintenance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en el repositorio."
            exit 1
          fi
          code=$(curl -s -o /tmp/sweep.json -w "%{http_code}" -X POST \
            "https://sea-lion-app-a2j4f.ondigitalocean.app/api/academy/streak/sweep/" \
            -H "X-Cron-Secret: $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/sweep.json || true; echo ""
          test "$code" = "200"
